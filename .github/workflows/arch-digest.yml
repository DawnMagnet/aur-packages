# Monthly reminder to bump the digest-pinned Arch build image.
#
# Dependabot cannot track scripts/archlinux-image. This job reads the current
# archlinux:base-devel index digest from Docker Hub's official
# library/archlinux repository and, if it differs from the pinned one, opens
# (or updates) a single reminder issue; once the pin is current again it closes
# it. Only issues opened by github-actions with the arch-digest-reminder label
# are touched (scripts/arch_digest_reminders.sh). It never changes the
# repository: the digest bump is a normal PR that goes through review.
name: Arch image digest

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of each month
  workflow_dispatch:

permissions: {}

concurrency:
  group: arch-digest
  cancel-in-progress: false

jobs:
  check:
    name: Check archlinux:base-devel digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      TITLE: Arch build image digest is outdated
      LABEL: arch-digest-reminder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with Docker Hub
        id: digest
        run: bash scripts/check_arch_digest.sh

      - name: Open or update the reminder issue
        if: steps.digest.outputs.status == 'outdated'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PINNED: ${{ steps.digest.outputs.pinned }}
          LATEST: ${{ steps.digest.outputs.latest }}
        run: |
          set -euo pipefail
          re='^archlinux:base-devel@sha256:[0-9a-f]{64}$'
          [[ "$PINNED" =~ $re && "$LATEST" =~ $re ]] || { echo "malformed digest output" >&2; exit 1; }
          body="$(printf '%s\n' \
            "Docker Hub's official \`library/archlinux:base-devel\` has a new index digest." \
            "" \
            "- pinned: \`${PINNED}\`" \
            "- latest: \`${LATEST}\`" \
            "" \
            "Open a PR that sets \`scripts/archlinux-image\` to the latest value; it goes through the usual review." \
            "Verify the digest yourself in that PR (run \`scripts/check_arch_digest.sh\` or query Docker Hub); do not copy the value from this issue." \
            "Checked by run ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}.")"
          # Idempotent: creates the label, or resets its color/description.
          gh label create "$LABEL" -R "$REPO" --force --color ededed \
            --description "Opened by the Arch image digest workflow"
          existing="$(bash scripts/arch_digest_reminders.sh)"
          existing="${existing%%$'\n'*}" # oldest one
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" -R "$REPO" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create -R "$REPO" --title "$TITLE" --label "$LABEL" --body "$body"
          fi

      - name: Close the reminder issue
        if: steps.digest.outputs.status == 'current'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PINNED: ${{ steps.digest.outputs.pinned }}
        run: |
          set -euo pipefail
          re='^archlinux:base-devel@sha256:[0-9a-f]{64}$'
          [[ "$PINNED" =~ $re ]] || { echo "malformed digest output" >&2; exit 1; }
          open_issues="$(bash scripts/arch_digest_reminders.sh)"
          for n in $open_issues; do
            gh issue close "$n" -R "$REPO" \
              --comment "\`scripts/archlinux-image\` (\`${PINNED}\`) matches Docker Hub again; closing."
            echo "closed issue #$n"
          done
