name: Update AUR packages

# Trust boundary: build runs untrusted upstream code (makepkg -s) in a second
# container that cannot see the sealed PKGBUILD. The build job has
# contents: read, no AUR key, and persist-credentials: false. Only the sealed
# PKGBUILD leaves via an artifact. publish checks out main again, recomputes
# the expected pkgver of every package from upstream itself, regenerates
# .SRCINFO with makepkg --printsrcinfo, and is the only job in the aur
# environment, the only job with AUR_SSH_PRIVATE_KEY, and the only job with
# contents: write.

on:
  schedule:
    # Every 2 days at 00:00 UTC (odd days of the month). GitHub may delay scheduled runs.
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Test-build and publish even when the upstream version is unchanged"
        type: boolean
        default: false
        required: false
  push:
    branches: [main]
    paths:
      - "maple-mono-nf-cn/**"
      - "memprocfs/**"
      - "moonbit-bin/**"
      - "cuda-api-wrappers-git/**"
      - "reflectcpp-git/**"
      - "nvchecker.toml"
      - "scripts/**"
      - ".github/workflows/update-aur.yml"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    concurrency:
      group: aur-update-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: maple-mono-nf-cn
            timeout: 45
            free_disk: false
          - package: memprocfs
            timeout: 45
            free_disk: false
          - package: moonbit-bin
            timeout: 60
            free_disk: false
          - package: cuda-api-wrappers-git
            timeout: 180
            free_disk: true
          - package: reflectcpp-git
            timeout: 120
            free_disk: false
          # hearthstone-linux-gui-bin and hearthstone-linux-gui-appimage are
          # prepared in this repo but omitted until those AUR packages are adopted.
          # asus-fa401km-acpi-fix has no upstream version and is not updated.

    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        if: ${{ matrix.free_disk }}
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup || true
          df -h

      - name: Install nvchecker
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install 'nvchecker>=2.19'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Update package files
        id: upd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_package.py "${{ matrix.package }}"

      - name: Show update diff
        if: steps.upd.outputs.changed == 'true'
        run: git diff -- "${{ matrix.package }}"

      # Read-only AUR RPC lookup. A repo version newer than the AUR is
      # treated as changed; an AUR version newer than the repo, or a package
      # missing on the AUR, fails the job. If the RPC cannot be read, the
      # comparison is skipped and changed stays as update_package.py set it,
      # so the RPC alone never triggers a publish.
      - name: Compare with the AUR
        id: aur
        env:
          PACKAGE: ${{ matrix.package }}
          CHANGED: ${{ steps.upd.outputs.changed }}
        run: python3 scripts/aur_rpc.py --package "$PACKAGE" --changed "$CHANGED"

      - name: Decide whether to build
        id: gate
        env:
          CHANGED: ${{ steps.aur.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
          # Schedule and push have no force_publish input. The comparison
          # below is false for those events, so the value cannot leak through.
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish == true }}
        run: |
          set -euo pipefail
          decision="$(bash scripts/ci_should_build.sh "$CHANGED" "$EVENT_NAME" "$FORCE")"
          echo "build=${decision}" >> "$GITHUB_OUTPUT"

      - name: Test build
        if: steps.gate.outputs.build == 'true'
        env:
          AUR_BUILD_OUT: ${{ runner.temp }}/aur-build-out
          PACKAGE: ${{ matrix.package }}
        run: bash scripts/test_build.sh "$PACKAGE"

      - name: Stage publish artifact
        if: success()
        env:
          PACKAGE: ${{ matrix.package }}
          BUILD: ${{ steps.gate.outputs.build }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/aur-stage"
          if [[ "$BUILD" == "true" ]]; then
            python3 scripts/publish_artifact.py stage \
              --package "$PACKAGE" \
              --baseline "${GITHUB_WORKSPACE}/${PACKAGE}/PKGBUILD" \
              --build-out "${RUNNER_TEMP}/aur-build-out" \
              --stage "$stage"
          else
            python3 scripts/publish_artifact.py stage-skip --stage "$stage"
          fi

      - name: Upload publish files
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-${{ matrix.package }}
          path: ${{ runner.temp }}/aur-stage
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ matrix.package }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aur
    permissions:
      contents: write
      actions: read
    concurrency:
      group: aur-update-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: maple-mono-nf-cn
            timeout: 45
            free_disk: false
          - package: memprocfs
            timeout: 45
            free_disk: false
          - package: moonbit-bin
            timeout: 60
            free_disk: false
          - package: cuda-api-wrappers-git
            timeout: 180
            free_disk: true
          - package: reflectcpp-git
            timeout: 120
            free_disk: false

    steps:
      - name: Checkout clean main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download build artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-${{ matrix.package }}
          path: ${{ runner.temp }}/aur-artifact

      - name: Require the build artifact
        if: steps.download.outcome != 'success'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "no publish artifact for ${PACKAGE}; the build job did not produce one" >&2
          exit 1

      # -git only: recompute pkgver on this host from upstream. The artifact
      # pkgver only names a commit; it must be on the upstream default branch
      # and the expected value is git describe of it with update_package.py's
      # transform. import rejects any artifact pkgver that differs.
      - name: Compute expected pkgver on the host
        id: expect
        if: steps.download.outcome == 'success' && endsWith(matrix.package, '-git')
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          python3 scripts/publish_artifact.py expect \
            --package "$PACKAGE" \
            --artifact "${RUNNER_TEMP}/aur-artifact"

      # Release packages: run the updater's version logic read-only on this
      # host against main's PKGBUILD (no writes into the checkout, no
      # nvchecker, moonbit's `moon version` runs in a no-network container),
      # then download every source URL of the expected source arrays here
      # (https only, no credentials, size and time capped, hashed in memory)
      # and hash local sources from the checkout. import requires the
      # artifact pkgver, pkgrel, source arrays and sha256sums arrays to match
      # exactly (-git packages: source arrays must equal main's). A skip
      # artifact downloads nothing.
      - name: Compute expected release version on the host
        id: expect_release
        if: steps.download.outcome == 'success' && !endsWith(matrix.package, '-git')
        env:
          PACKAGE: ${{ matrix.package }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/publish_artifact.py expect-release \
            --package "$PACKAGE" \
            --artifact "${RUNNER_TEMP}/aur-artifact" \
            --main-pkgbuild "${GITHUB_WORKSPACE}/${PACKAGE}/PKGBUILD"

      - name: Import artifact
        id: import
        if: steps.download.outcome == 'success'
        env:
          PACKAGE: ${{ matrix.package }}
          EXPECTED_PKGVER: ${{ steps.expect.outputs.pkgver || steps.expect_release.outputs.pkgver }}
          EXPECTED_COMMIT: ${{ steps.expect.outputs.commit }}
          EXPECTED_PKGREL: ${{ steps.expect_release.outputs.pkgrel }}
          EXPECTED_SOURCES: ${{ steps.expect_release.outputs.sources }}
          EXPECTED_SHA256SUMS: ${{ steps.expect_release.outputs.sha256sums }}
        run: |
          set -euo pipefail
          python3 scripts/publish_artifact.py import \
            --package "$PACKAGE" \
            --artifact "${RUNNER_TEMP}/aur-artifact" \
            --dest "${GITHUB_WORKSPACE}/${PACKAGE}" \
            --expected-pkgver "$EXPECTED_PKGVER" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-pkgrel "$EXPECTED_PKGREL" \
            --expected-sources "$EXPECTED_SOURCES" \
            --expected-sha256sums "$EXPECTED_SHA256SUMS"

      - name: Regenerate .SRCINFO
        if: steps.import.outputs.publish == 'true'
        env:
          PACKAGE: ${{ matrix.package }}
        run: bash scripts/regen_srcinfo.sh "$PACKAGE"

      - name: Show publish diff
        if: steps.import.outputs.publish == 'true'
        env:
          PACKAGE: ${{ matrix.package }}
        run: git diff -- "$PACKAGE"

      - name: Publish to AUR and main
        if: steps.import.outputs.publish == 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: bash scripts/publish.sh "$PACKAGE"
